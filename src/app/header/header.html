<header class="app-header">
  @if (showSearch) {
    <div class="app-header__search">
      <img src="/svg/search.svg" alt="" class="app-header__search-icon" aria-hidden="true" />
      <input
        type="text"
        class="app-header__search-input"
        [placeholder]="searchPlaceholder"
        (input)="onSearchInput($any($event.target).value)"
        aria-label="Search"
      />
    </div>
  }

  <div class="app-header__actions">
    <div class="app-header__language">
      <button
        type="button"
        class="app-header__language-trigger"
        (click)="toggleLanguageMenu()"
        [attr.aria-expanded]="isLanguageMenuOpen"
        aria-haspopup="listbox"
        [attr.aria-label]="'Change language, current: ' + activeLanguageLabel"
      >
        <img src="/svg/world.svg" alt="" aria-hidden="true" />
      </button>

      @if (isLanguageMenuOpen) {
        <ul class="app-header__language-menu" role="listbox">
          @for (language of languages; track language.code) {
            <li
              role="option"
              [attr.aria-selected]="language.code === activeLanguage"
              class="app-header__language-option"
              [class.app-header__language-option--active]="language.code === activeLanguage"
              (click)="selectLanguage(language)"
            >
              {{ language.label }}
            </li>
          }
        </ul>
      }
    </div>

    <button type="button" class="app-header__icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.268 21a2 2 0 0 0 3.464 0" />
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
      </svg>
    </button>

    <div class="app-header__divider"></div>

    <div class="app-header__user-info">
      <span class="app-header__user-name">{{ currentUser.name }}</span>
      <span class="app-header__user-role">{{ currentUser.role }}</span>
    </div>

    <div class="app-header__avatar">
      @if (currentUser.avatarUrl) {
        <img [src]="currentUser.avatarUrl" [alt]="currentUser.name" />
      } @else {
        <span>{{ currentUser.initials }}</span>
      }
    </div>
  </div>
</header>
