<main class="dashboard">
  <h1 class="dashboard__title">
    <img src="/svg/sidnav-dashboard.svg" alt="" class="dashboard__title-icon" aria-hidden="true" />
    Dashboard
  </h1>

  <section class="dashboard__stats">
    @for (card of statCards; track card.label) {
      <app-stat-card [data]="card" />
    }
  </section>

  <section class="dashboard__row">
    <div class="dashboard-card dashboard-card--profit">
      <app-profit-overview-card
        [data]="profitOverview"
        [trendPercent]="12.7">
      </app-profit-overview-card>
    </div>

    <div class="dashboard-card dashboard-card--analytics">
      <app-analytics-card
        title="Analytics Overview"
        [dataByRange]="analyticsData"
        viewFullReportLink="/analytics"
      />
    </div>

    <div class="dashboard-card">
      <p class="dashboard-card__header">Quick Actions</p>
      <button type="button" class="quick-action" routerLink="/schools/new">
        <img src="/svg/school.svg" alt="" class="quick-action__icon" aria-hidden="true" />
        <span>Add School</span>
        <img src="/svg/chevron-right.svg" alt="" class="quick-action__arrow" aria-hidden="true" />
      </button>
      <button type="button" class="quick-action" routerLink="/students/new">
        <img src="/svg/user-plus.svg" alt="" class="quick-action__icon" aria-hidden="true" />
        <span>Add Expense</span>
        <img src="/svg/chevron-right.svg" alt="" class="quick-action__arrow" aria-hidden="true" />
      </button>
      <button type="button" class="quick-action" routerLink="/teachers/new">
        <img src="/svg/complaint.svg" alt="" class="quick-action__icon" aria-hidden="true" />
        <span>view Complaint </span>
        <img src="/svg/chevron-right.svg" alt="" class="quick-action__arrow" aria-hidden="true" />
      </button>
    </div>
  </section>

  <section class="dashboard__row dashboard__row--two">
    <div class="dashboard-card">
      <p class="dashboard-card__header">
        <img src="/svg/cash.svg" alt="" class="dashboard-card__header-icon" aria-hidden="true" />
        Fee Collections
        <span class="dashboard-card__header-value">{{ feeCollection.amount }}</span>
      </p>

      <app-progress-bar [value]="feeCollection.collectedPercent" color="green" [showPercentage]="false" />

      <div class="dashboard-card__chips">
        <a routerLink="/fees" class="chip chip--neutral">View Details</a>
        <a routerLink="/fees/defaulters" class="chip chip--danger">Defaulters List</a>
      </div>
    </div>

    <div class="dashboard-card">
      <p class="dashboard-card__header">
        <img src="/svg/calendar.svg" alt="" class="dashboard-card__header-icon" aria-hidden="true" />
        Exam Schedule
        <span class="dashboard-card__header-value">{{ upcomingExamsCount }} Upcoming</span>
      </p>

      <ul class="exam-list">
        @for (exam of examItems; track exam.title) {
          <li class="exam-list__item">
            <span class="exam-list__dot" [style.background]="exam.dotColor"></span>
            <span class="exam-list__title">{{ exam.title }}</span>
            <span class="exam-list__date">({{ exam.date }})</span>
          </li>
        }
      </ul>

      <div class="dashboard-card__chips">
        <button type="button" class="chip chip--neutral" routerLink="/exams/new">Add Exam</button>
        <button type="button" class="chip chip--neutral" routerLink="/exams">View All</button>
      </div>
    </div>
  </section>
</main>
