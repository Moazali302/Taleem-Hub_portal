<div (click)="$event.stopPropagation()">
  <!-- Tag Label + Count (Optional) -->
  <ng-container *ngIf="params.tagLabel && params.tagCount !== undefined">
    <div class="tag-container"
         [class.clickable]="params.onTagClick"
         (click)="params.onTagClick ? TagClick($event) : null">
         <span class="tag-count">{{ params.tagCount }}&nbsp;</span>
         <span class="tag-label">{{ params.tagLabel }}</span>
    </div>
  </ng-container>

  <!-- Trigger Icon & Mat Menu -->
  <div *ngIf="!params.hideMenu"
       class="grid-action-icon"
       [matMenuTriggerFor]="actionMenu" (click)="$event.stopPropagation()" #menuTrigger="matMenuTrigger">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="1" />
      <circle cx="12" cy="19" r="1" />
      <circle cx="12" cy="5" r="1" />
    </svg>
  </div>

  <mat-menu #actionMenu="matMenu">
    <button mat-menu-item *ngIf="params.onView" (click)="menuTrigger.closeMenu();View($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>
      <span>View Detail</span>
    </button>

    <button mat-menu-item *ngIf="params.onEdit" (click)="menuTrigger.closeMenu();Edit($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /></svg>
      <span>Edit</span>
    </button>

    <button mat-menu-item *ngIf="params.onDownload" (click)="menuTrigger.closeMenu();Download($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>
      <span>Download</span>
    </button>

    <button mat-menu-item *ngIf="params.onHistory" (click)="menuTrigger.closeMenu();OnHistory($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8l0 4l2 2" /><path d="M3.05 11a9 9 0 1 1 .5 4" /><path d="M3 16v-5h5" /></svg>
      <span>View History</span>
    </button>

    <button mat-menu-item *ngIf="params.onViewUsers" (click)="menuTrigger.closeMenu();OnViewUsers($event)" style="position: relative;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 11c1.657 0 3 -1.343 3 -3c0 -1.657 -1.343 -3 -3 -3" /><path d="M19.999 21c.001 -.11 .001 -.22 .001 -.333a4 4 0 0 0 -3 -3.867" /></svg>
      <span>View Users</span>
      <div class="counter" *ngIf="params.usersCount">{{ params.usersCount }}</div>
    </button>

    <button mat-menu-item *ngIf="params.onMobileConfig">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="1" /><path d="M11 5h2" /></svg>
      <span>View Mobile & QR Config</span>
    </button>

    <button mat-menu-item *ngIf="params.onLicenses">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M7 9h10" /><path d="M7 13h6" /></svg>
      <span>View All Licenses</span>
    </button>

    <button mat-menu-item *ngIf="params.onCloseTicket" (click)="menuTrigger.closeMenu();CloseTicket($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M10 10l4 4m0 -4l-4 4" /></svg>
      <span>Close Ticket</span>
    </button>

    <button mat-menu-item *ngIf="params.onNotifyPartner" (click)="menuTrigger.closeMenu();NotifyPartner($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
      <span>Notify Partner</span>
    </button>

    <button mat-menu-item *ngIf="params.onNotifyClient" (click)="menuTrigger.closeMenu();NotifyClient($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
      <span>Notify Client</span>
    </button>

    <button mat-menu-item *ngIf="params.onDelete" (click)="menuTrigger.closeMenu();Delete($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
      <span>Delete</span>
    </button>

    <button mat-menu-item *ngIf="params.onAddLog" (click)="menuTrigger.closeMenu();AddLog($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></svg>
      <span>Add Time Log</span>
    </button>

    <!--Send email-->
    <button mat-menu-item *ngIf="params.onsendtoemail" (click)="menuTrigger.closeMenu();SendToEmail($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6l9 -6" /></svg>
      <span>Send to Email</span>
    </button>

    <button mat-menu-item *ngIf="params.acceptTimeOff" (click)="menuTrigger.closeMenu();AcceptTimeOff($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
      <span>Accept</span>
    </button>

    <button mat-menu-item *ngIf="params.rejectTimeOff" (click)="menuTrigger.closeMenu();RejectTimeOff($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
      <span>Reject</span>
    </button>

    <button mat-menu-item *ngIf="params.onApprove" (click)="menuTrigger.closeMenu();Approve($event)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
      <span>Approve</span>
    </button>
  </mat-menu>

  <!-- Delete Icon for hideMenu=true -->
  <ng-container *ngIf="params.hideMenu">
    <div class="action-parent">
      <div class="action-button" *ngIf="params.onDownload" (click)="Download($event)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>
      </div>
      <div class="action-button" *ngIf="params.onEdit" (click)="Edit($event)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /></svg>
      </div>
      <div class="action-button" *ngIf="params.onDelete" (click)="Delete($event)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
      </div>
    </div>
  </ng-container>
</div>
