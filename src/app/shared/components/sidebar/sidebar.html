@if (config) {
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">Taleem<span class="sidebar__logo-accent">Hub</span></span>
      <span class="sidebar__role-label">{{ config.roleLabel }}</span>
    </div>

    <nav class="sidebar__nav">
      <ul class="sidebar__list">
        @for (item of config.items; track item.route) {
          <li>
            <a
              [routerLink]="[config.basePath, item.route]"
              routerLinkActive="sidebar__link--active"
              class="sidebar__link"
            >
              <span class="sidebar__icon" [style.--icon-url]="'url(' + item.icon + ')'" aria-hidden="true"></span>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (config.footerAction; as action) {
      <a [routerLink]="[config.basePath, action.route]" class="sidebar__footer-btn">
        <span aria-hidden="true">+</span>
        {{ action.label }}
      </a>
    }
  </aside>
}
