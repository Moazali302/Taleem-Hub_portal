<div class="bar-chart" role="img" [attr.aria-label]="ariaLabel">
  @for (bar of bars; track bar.label) {
    <div class="bar-chart__column">
      <div class="bar-chart__plot">
        <div
          class="bar-chart__bar"
          [class.bar-chart__bar--highlight]="bar.highlighted"
          [style.height.%]="bar.heightPercent"
          [title]="bar.tooltip"
        ></div>
      </div>
      <span class="bar-chart__label">{{ bar.label }}</span>
    </div>
  }
</div>
